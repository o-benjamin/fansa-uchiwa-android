name: Daily Auto Refactoring

# ワークフローの実行タイミングを定義します
on:
  schedule:
    - cron: '0 22 * * *' 
  workflow_dispatch: 

jobs:
  refactor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 【重要】全てのリモートブランチ情報を取得し、後の切り替えを可能にします
          fetch-depth: 0

      # --- releaseブランチの特定と切り替え ---
      - name: Determine release branch and checkout
        id: branch-check
        run: |
          # リモートリポジトリから 'release/' で始まるブランチの一覧を取得
          BRANCHES=$(git ls-remote --heads origin "refs/heads/release/*" | awk '{print $2}' | sed 's|refs/heads/||')
          
          # 見つかったブランチの数をカウント
          BRANCH_COUNT=$(echo "$BRANCHES" | awk 'NF' | wc -l)
          
          if [ "$BRANCH_COUNT" -eq 0 ]; then
            echo "エラー: 'release/' から始まるブランチが見つかりません。処理を中止します。"
            exit 1
          elif [ "$BRANCH_COUNT" -gt 1 ]; then
            echo "エラー: 'release/' から始まるブランチが複数存在します。処理を中止します。"
            echo "見つかったブランチ:"
            echo "$BRANCHES"
            exit 1
          fi
          
          # 1つだけ見つかった場合、そのブランチ名を確定（trコマンドで余計な空白や改行を完全に削除）
          BASE_BRANCH=$(echo "$BRANCHES" | awk 'NF' | tr -d '[:space:]')
          echo "ベースブランチを $BASE_BRANCH に決定しました。"
          
          # 【重要】ここで master から release/〜 ブランチに切り替えます！
          git checkout "$BASE_BRANCH"
          
          # 最後のPR作成ステップで確実に使えるように環境変数に記録
          echo "BASE_BRANCH=$BASE_BRANCH" >> $GITHUB_ENV

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Run Copilot CLI for Refactoring
        env:
          GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }} 
        run: |
          TARGET_FILE=$(find app/src/main/java -name "*.kt" -type f | shuf -n 1)
          echo "本日のターゲット: $TARGET_FILE"
          
          copilot -p "対象のKotlinファイル ($TARGET_FILE) を、MVVMとDDD-like Layered Architectureの設計思想に従ってリファクタリングし、ファイルを直接上書き保存してください。
          【厳守ルール】
          1. PDS(Presentation Domain Separation)の徹底
          2. ViewModelの責務はUI状態保持とイベントディスパッチのみに限定
          3. アプリケーションの既存の動作（UIや機能）は一切変更しないこと" \
            --no-ask-user \
            --allow-tool='shell(git:*)' \
            --allow-tool='read' \
            --allow-tool='write'

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          BRANCH_NAME="auto-refactor/$(date +%Y%m%d)"
          git checkout -b "$BRANCH_NAME"
          
          git add .
          
          if git diff --staged --quiet; then
            echo "リファクタリングの必要なしと判断されました。PR作成をスキップします。"
            exit 0
          fi
          
          git commit -m "refactor: Copilot CLIによる自動リファクタリング"
          git push origin "$BRANCH_NAME"
          
          # GitHub側が新しいブランチを認識するまで5秒待つ（エラー防止）
          sleep 5
          
          # PRの向け先(--base)を main ではなく、上で取得した release/〜 ブランチに設定
          gh pr create \
            --title "[Auto-Maintenance] 日次リファクタリング ($TARGET_FILE)" \
            --body "GitHub Copilot CLIによる自動リファクタリングの提案です。
            設計ルール（MVVM・ViewModelの責務）に準拠しているか確認をお願いします。" \
            --base "${{ env.BASE_BRANCH }}" \
            --head "$BRANCH_NAME"
