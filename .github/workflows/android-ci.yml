name: Android CI

# push するたびに、コンパイル・ユニットテスト・Lint を実行する。
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master, "release/**"]
  workflow_dispatch:

# 同じブランチで新しい push があったら、古い実行は取り消す
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # 同じリポジトリのブランチは push で実行されるため、PR での二重実行を避ける（fork からの PR だけ実行する）
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      # 公開リポジトリのため秘密情報は使わない。
      # google-services.json はダミー、release の広告 ID は Google 公式のテスト ID で代用する（debug ビルドしか作らない）。
      - name: Prepare dummy config
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "fansa-uchiwa-ci",
              "storage_bucket": "fansa-uchiwa-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.fansauchiwa" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "ci-dummy-api-key" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          cat > local.properties <<'PROPS'
          ADMOB_APPLICATION_ID_RELEASE=ca-app-pub-3940256099942544~3347511713
          ADMOB_REWARDED_ID_RELEASE=ca-app-pub-3940256099942544/5224354917
          ADMOB_BANNER_ID_RELEASE=ca-app-pub-3940256099942544/9214589741
          ADMOB_INTERSTITIAL_ID_RELEASE=ca-app-pub-3940256099942544/1033173712
          PROPS

      - name: Unit tests and Lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --continue

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 7
